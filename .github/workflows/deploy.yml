name: Deploy Eleventy to GitHub Pages

on:
  push:
    branches: [ "main" ]
  # Am 2026-08-26 gemessen: der Merge von PR #29 (Commit 309ab43) loeste
  # KEINEN Deploy aus - fuer diesen Commit existiert kein Workflow-Lauf, der
  # letzte lief um 05:45 UTC gegen db21509. Pushes, die ein Bot mit dem
  # GITHUB_TOKEN erzeugt, starten keine Workflows. Ohne Handausloeser bleibt
  # eine gemergte Seite dann unsichtbar - hier /qr/sale/, das Ziel eines
  # bereits GEDRUCKTEN QR-Codes. Ein toter QR im Buch ist nicht reparierbar.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # public/ ist das Bau-Erzeugnis und seit dem 08.09.2026 nicht mehr
      # versioniert (siehe .gitignore). Diese Pruefung haelt den Weg zu: eine
      # .gitignore-Zeile verhindert kein "git add -f" und keinen Merge, der den
      # Ordner wieder mitbringt. Kaeme er zurueck, laege im CI wieder ein
      # Altstand neben dem frischen Bau - und der Upload-Schritt laedt den
      # ganzen Ordner hoch, also auch die alten Dateien.
      - name: public/ darf nicht versioniert sein
        run: |
          if [ -n "$(git ls-files public)" ]; then
            echo "::error::Der Ordner public/ ist wieder in der Versionsverwaltung."
            echo "Er ist das Erzeugnis von 'npm run build' und wird im CI ohnehin neu gebaut."
            echo "Bitte 'git rm -r --cached public' ausfuehren und den Commit wiederholen."
            git ls-files public | head -20
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Eleventy Site
        run: npm run build

      - name: Upload Build Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4