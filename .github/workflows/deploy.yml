name: Deploy Eleventy to GitHub Pages

on:
  push:
    branches: [ "main" ]
  # Am 2026-08-26 gemessen: der Merge von PR #29 (Commit 309ab43) loeste
  # KEINEN Deploy aus - fuer diesen Commit existiert kein Workflow-Lauf, der
  # letzte lief um 05:45 UTC gegen db21509. Pushes, die ein Bot mit dem
  # GITHUB_TOKEN erzeugt, starten keine Workflows. Ohne Handausloeser bleibt
  # eine gemergte Seite dann unsichtbar - hier /qr/sale/, das Ziel eines
  # bereits GEDRUCKTEN QR-Codes. Ein toter QR im Buch ist nicht reparierbar.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Eleventy Site
        run: npm run build

      - name: Upload Build Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4